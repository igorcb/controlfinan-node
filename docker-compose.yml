services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: controlfinan_node
    volumes:
      - db_data:/var/lib/postgresql/data

  web:
    build: .
    environment:
      DATABASE_URL: postgres://app:app@db:5432/controlfinan_node
      TEST_DATABASE_URL: postgres://app:app@db:5432/controlfinan_node_test
      SECRET_KEY_BASE: development-only-secret
      BCRYPT_COST: 12
    ports:
      - "8008:8000"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    depends_on:
      - db

volumes:
  db_data:
  node_modules:
